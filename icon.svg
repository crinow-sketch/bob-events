<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="hop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C5AB"/>
      <stop offset="100%" stop-color="#7A9B7E"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Decorative hop/wheat accent top-right -->
  <circle cx="400" cy="90" r="22" fill="url(#hop)" opacity="0.5"/>
  <circle cx="370" cy="115" r="16" fill="url(#hop)" opacity="0.4"/>
  <circle cx="420" cy="130" r="12" fill="url(#hop)" opacity="0.3"/>
  <!-- Beer mug silhouette -->
  <rect x="150" y="180" width="180" height="220" rx="20" fill="#C2654A"/>
  <rect x="160" y="190" width="160" height="200" rx="14" fill="#D4816A"/>
  <!-- Mug handle -->
  <path d="M330 230 Q380 230 380 280 Q380 330 330 330" stroke="#C2654A" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Foam -->
  <ellipse cx="240" cy="195" rx="85" ry="22" fill="#FAF7F2"/>
  <ellipse cx="210" cy="188" rx="30" ry="16" fill="#fff" opacity="0.8"/>
  <ellipse cx="265" cy="190" rx="25" ry="14" fill="#fff" opacity="0.6"/>
  <!-- Foam bubbles -->
  <circle cx="195" cy="182" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="260" cy="180" r="6" fill="#fff" opacity="0.4"/>
  <!-- BOB text -->
  <text x="256" y="460" font-family="Georgia,serif" font-size="80" font-weight="bold" fill="#FFB81C" text-anchor="middle" letter-spacing="8">BOB</text>
  <!-- Subtle tagline -->
  <text x="256" y="490" font-family="Arial,sans-serif" font-size="20" fill="#FAF7F2" text-anchor="middle" opacity="0.7" letter-spacing="4">STAFF HUB</text>
</svg>
